name: Release — Build & Publish pro-diagrams.skill

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Test, Package & Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run 38 stdlib regression, adversarial & ISO 5807 Annex A-E tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -B -W error::ResourceWarning -m unittest discover -s skills/pro-diagrams/tests -v

      - name: Package pro-diagrams.skill archive
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -B - <<'PY'
          import os
          import zipfile

          src = "skills/pro-diagrams"
          out = "pro-diagrams.skill"
          excluded_dirs = {"__pycache__", "evals", ".git"}
          excluded_exts = {".pyc", ".pyo"}

          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as zf:
              for root, dirs, files in os.walk(src):
                  dirs[:] = sorted(d for d in dirs if d not in excluded_dirs)
                  for fn in sorted(files):
                      if fn == ".DS_Store" or os.path.splitext(fn)[1] in excluded_exts:
                          continue
                      full = os.path.join(root, fn)
                      arc = os.path.join("pro-diagrams", os.path.relpath(full, src))
                      zf.write(full, arc)

          with zipfile.ZipFile(out) as zf:
              names = zf.namelist()
              assert "pro-diagrams/SKILL.md" in names, "Missing SKILL.md"
              assert "pro-diagrams/data/APACHE-2.0.txt" in names, "Missing APACHE-2.0.txt"
              assert not any("__pycache__" in n or n.endswith(".pyc") for n in names), "Bytecode leaked"
              print(f"Packaged {out}: {os.path.getsize(out)} bytes, {len(names)} entries")
          PY

      - name: Publish GitHub Release with pro-diagrams.skill
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cat <<'EOF' > /tmp/release_notes.md
          ## Pro. Diagrams (`pro-diagrams`)

          Zero-dependency (100% Python 3 stdlib) Agent Skill for publication-grade **ISO 5807:1985 diagrams (§4–§11)**, **ISO 5807 cross-functional Swimlane SOPs & interactive Runbooks**, **topological graphs & CPM critical path networks**, **`data-*`-verified quantitative charts**, and **mathematical function plots** styled with the **Atelier Technical Warm** palette (WCAG AA/AAA) and **Open Sans** typography.

          ### Highlights
          - **All 5 ISO 5807:1985 chart types (§4–§8) verified against official Annex A–E:** `data-flowchart` (Annex A), `program-flowchart` (Annex B(a)/B(b)), `system-flowchart` (Annex C), `program-network` (Annex D), and `system-resources` (Annex E) with `--diagram-type` auto-detection and `--iso-only` separation from layout/contrast warnings.
          - **Complete 26-symbol catalog + 4 ISO §9.3 line types:** Added `card` (§9.1.2.6), `paper_tape` (§9.1.2.7), `ellipsis` (§9.4.4), stacked `multi_document` per-layer labels (§10.3.2), bidirectional read/write arrows (`startArrow` + `endArrow` in `.drawio` & `.svg`), Control Transfer `P`/`T`/`I` triangles (§9.3.2.1), Communication Link zigzags (§9.3.2.2), and single-stem Decision fan-outs (§10.3.1(b)).
          - **Hardened ISO 5807 validator (`validate_iso5807.py`):** Rejects blank/chrome-only `.drawio` pages (`E-ISO-EMPTY`), validates Loop Limit start–end pairs per `loop_id` (`E-ISO-LOOP-PAIR`), pairs connectors across multi-page `<diagram>` documents with page references (§9.4.1 / §10.2.2), demotes `>3`-branch Decisions to advisory layout hint (`I-LAYOUT-DECISION-FANOUT`), normalizes whitespace lane IDs, and triggers CPM only when `kind == "cpm"` or `compute_cpm: true`.
          - **CI quality gates:** 38/38 stdlib regression & `.drawio`↔`.svg` parity tests (Python 3.11 & 3.12), byte-for-byte `examples/` drift diff check, and a `windows-latest` PowerShell `.skill` unpack & run job.

          ### Installation / Cài đặt nhanh
          - **Agent Skills CLI:** `npx skills add vietdq99tb/pro-diagrams`
          - **Claude Desktop / Offline ZIP:** Download `pro-diagrams.skill` attached below and import under *Capabilities → Skills* (macOS/Linux: `unzip pro-diagrams.skill -d ~/.claude/skills/`; Windows PowerShell: `Copy-Item pro-diagrams.skill pro-diagrams.zip; Expand-Archive pro-diagrams.zip -DestinationPath "$env:USERPROFILE\.claude\skills" -Force`).
          EOF

          gh release create "$TAG_NAME" pro-diagrams.skill \
            --title "Pro. Diagrams $TAG_NAME — Full ISO 5807:1985 (§4–§11), Swimlane SOPs, CPM & Honest Charts" \
            --notes-file /tmp/release_notes.md
