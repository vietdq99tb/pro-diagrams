<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biến động Chi phí Vận hành 2025 → 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=JetBrains+Mono:wght@500;600&display=swap" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 28px 24px;
      background: #F8F6F2;
      color: #1C2327;
      font-family: 'Open Sans', 'Segoe UI', Roboto, Arial, sans-serif;
      line-height: 1.5;
    }
    .frame {
      max-width: 968px;
      margin: 0 auto;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #AD4333;
      margin-bottom: 6px;
    }
    .eyebrow::before {
      content: "";
      width: 28px;
      height: 2px;
      background: currentColor;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      line-height: 1.25;
      color: #2B373E;
    }
    .subtitle {
      margin: 0 0 18px;
      font-size: 14px;
      color: #526068;
    }
    .kpi-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .kpi-card {
      background: #FFFFFF;
      border: 1px solid #C9D2D8;
      border-radius: 10px;
      padding: 12px 16px;
    }
    .kpi-label {
      font-size: 12px;
      color: #526068;
    }
    .kpi-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 22px;
      font-weight: 600;
      color: #2B373E;
      margin-top: 2px;
    }
    .kpi-delta {
      font-size: 12px;
      font-weight: 600;
      margin-top: 2px;
    }
    .chart-box {
      border: 1px solid #C9D2D8;
      border-radius: 12px;
      background: #FFFFFF;
      overflow: hidden;
    }
    .chart-box svg {
      display: block;
      width: 100%;
      height: auto;
    }
    .source {
      margin-top: 10px;
      font-size: 12px;
      color: #526068;
    }
  </style>
</head>
<body>
  <main class="frame">
    
    <h1>Biến động Chi phí Vận hành 2025 → 2026</h1>
    <p class="subtitle">Đơn vị: triệu đồng · Dữ liệu minh họa kiểm định bảo toàn tổng data-*</p>
    <div class="kpi-strip"><div class="kpi-card"><div class="kpi-label">Chi phí 2025</div><div class="kpi-val">850 tr</div><div class="kpi-delta" style="color:#526068">Mốc đầu kỳ</div></div><div class="kpi-card"><div class="kpi-label">Tiết kiệm tối ưu</div><div class="kpi-val">-240 tr</div><div class="kpi-delta" style="color:#526068">Lưu trữ lạnh + Tự động hóa</div></div><div class="kpi-card"><div class="kpi-label">Chốt 2026</div><div class="kpi-val">860 tr</div><div class="kpi-delta" style="color:#2D6A5B">+10 tr (+1.2% YoY)</div></div></div>
    <div class="chart-box">

<text x="816.67" y="144.20" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" fill="#1C2327">860 tr</text>

</svg>
    </div>
    <div class="source">Ví dụ chuẩn Pro. Diagrams (Atelier Technical Warm)</div>
  </main>
</body>
</html>
